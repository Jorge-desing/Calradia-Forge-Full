name: Release Packaging & Distribution Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release with packaged archives'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package-and-distribute:
    name: Package FastPackageEngine Distribution Archives
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (8.0.x)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Calradia Forge Python tooling
        shell: cmd
        run: call tools\Setup-CalradiaForge-Python.bat --no-pause

      - name: Execute FastPackageEngine Packaging
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1

      - name: Audit Distribution Archives & Safety Constraints
        shell: powershell
        run: |
          $archives = Get-ChildItem -Path artifacts\*.zip
          if ($archives.Count -lt 3) {
              throw "Expected at least 3 release archives in artifacts/, found $($archives.Count)"
          }
          Write-Host "=== Generated Distribution Archives ==="
          $archives | ForEach-Object {
              $sizeMB = [math]::Round($_.Length / 1MB, 2)
              Write-Host "Archive: $($_.Name) ($sizeMB MB)"
          }
          $audits = Get-ChildItem -Path artifacts\package-audit-*.json
          if ($audits.Count -ge 1) {
              Write-Host "Audit record present: $($audits[0].Name)"
          }

      - name: Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: CalradiaForge-Release-Packages
          path: |
            artifacts/*.zip
            artifacts/*.json
            artifacts/*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (On Tag or Dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/CalradiaForge-Modules-*.zip
            artifacts/CalradiaForge-Source-SDK-*.zip
            artifacts/CalradiaForge-Desktop-*.zip
            artifacts/package-audit-*.json
            artifacts/package-sha256-*.txt
          generate_release_notes: true
          draft: false
          prerelease: false
