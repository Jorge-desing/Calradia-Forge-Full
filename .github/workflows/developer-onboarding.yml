name: Calradia Forge Developer Onboarding

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-onboarding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-template-smoke:
    name: Package and generate a portable Bannerlord module template
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Prepare repository Python tools
        shell: cmd
        run: call tools\Setup-CalradiaForge-Python.bat --no-pause

      - name: Pack SDK and install/generate/restore the template
        shell: cmd
        run: call tools\Test-CalradiaForge-Developer-Onboarding.bat --portable-only --no-pause

      - name: Upload onboarding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-onboarding-smoke
          path: artifacts/sdk-evolution/onboarding/
          if-no-files-found: warn
          retention-days: 14
