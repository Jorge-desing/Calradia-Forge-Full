name: Ledger Integrity & Documentation Audit

on:
  push:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'tools/**'
      - '.agents/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'tools/**'
      - '.agents/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-integrity:
    name: SHA-256 Ledger & Documentation Parity Audit
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python (3.12)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare Calradia Forge Python tooling
        shell: cmd
        run: call tools\Setup-CalradiaForge-Python.bat --no-pause

      - name: Audit Ledger, Playbooks, Code Smells & Documentation Parity
        shell: cmd
        run: call tools\Run-CalradiaForge-Python-Checks.bat --ledger --no-pause
