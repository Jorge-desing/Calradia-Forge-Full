name: Calradia Forge CI - Build & Quality Gates

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Gate & Portable Test Suite (Windows)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (8.0.x)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python (3.12)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare Calradia Forge Python tools and agent test profile
        shell: cmd
        run: call tools\Setup-CalradiaForge-Python.bat --agents --no-pause

      - name: Build and run portable suites through BAT
        shell: cmd
        run: call tools\Run-CalradiaForge-Tests.bat --portable-only --no-pause

      - name: Verify Stateless Campaign Behavior Gate (Mandatory)
        shell: cmd
        run: call tools\Verify-CalradiaForge-StatelessBehavior.bat --portable

      - name: Bannerlord integration build scope
        shell: cmd
        run: echo Bannerlord net472 module and Core tests require licensed TaleWorlds assemblies through GameBin; this hosted runner validates portable net8.0 targets only.

      - name: Run Python Quality, Asset & Agent Checks
        shell: cmd
        run: call tools\Run-CalradiaForge-Python-Checks.bat --ci --agents --no-pause
